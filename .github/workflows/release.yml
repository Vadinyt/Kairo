name: Build & Attach Release APK

on:
  push:
    branches:
      - performance/local-fast-v1
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests and build release APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Upload Release APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Kairo-${TAG_NAME}-release.apk"
          gh release upload "${TAG_NAME}" "Kairo-${TAG_NAME}-release.apk" --clobber

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kairo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
